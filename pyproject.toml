[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "credo-count-sde-v4"
version = "4.0.0.dev40"
description = "Count-native finite-measure SDE recipe for longitudinal perturbation screens"
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-only"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "Yu Adam Ding"}]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "h5py>=3.10",
  "numpy>=1.26",
  "pandas>=2.1",
  "pyarrow>=14",
  "pydantic>=2.0",
  "pyyaml>=6",
  "scipy>=1.11",
  "torch>=2.1",
]

[project.optional-dependencies]
test = ["build>=1.2", "mypy>=1.15", "pytest>=8", "pytest-cov>=5", "ruff>=0.9"]

[project.scripts]
credo-v4 = "credo_count_sde_v4.cli.app:main"

# Development versions deliberately do not register with ``credo.recipes``.
# Stable 4.0 adds the quoted discovery entry only after its bridge test passes.

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
credo_count_sde_v4 = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = ["gpu: requires CUDA", "slow: longer synthetic lifecycle"]

[tool.coverage.run]
branch = true
source = ["credo_count_sde_v4"]

[tool.coverage.report]
fail_under = 85
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
ignore_missing_imports = true
warn_return_any = false
