name: Scheduled GPU qualification

on:
  workflow_dispatch:
  schedule:
    - cron: "17 7 * * 0"

permissions:
  contents: read

jobs:
  cuda-smoke:
    runs-on: [self-hosted, linux, gpu]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: yuadamding/CREDO
          ref: 6f4f57c114606476cb6e93c6d52dc34628173a4d
          path: CREDO
      - run: python -m pip install -e '.[test]'
      - name: CUDA lifecycle and memory guard
        env:
          CREDO_V4_WORKSPACE_ROOT: ${{ github.workspace }}
          PYTHONDONTWRITEBYTECODE: "1"
          CUBLAS_WORKSPACE_CONFIG: ":4096:8"
        run: |
          python -c 'import torch; assert torch.cuda.is_available(), "GPU qualification requires CUDA"'
          pytest -q -s -m gpu tests/gpu --basetemp=artifacts/gpu-tests --junitxml=artifacts/gpu-tests.xml
      - name: Retain CUDA qualification measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cuda-qualification-${{ github.sha }}
          path: |
            artifacts/gpu-tests.xml
            artifacts/gpu-tests/**/CUDA_QUALIFICATION.json
          if-no-files-found: warn
